# Local single-user Invidious stack (prebuilt images, no source build).
# Secrets live in .env (git-excluded). Bound to 127.0.0.1 only.
#
#   docker compose -f docker-compose.local.yml up -d
#   docker compose -f docker-compose.local.yml logs -f
#   docker compose -f docker-compose.local.yml down

services:

  invidious:
    image: quay.io/invidious/invidious:latest
    restart: unless-stopped
    ports:
      # 3000 is taken by the local Grafana container.
      - "127.0.0.1:3001:3000"
    depends_on:
      invidious-db:
        condition: service_healthy
      invidious-companion:
        condition: service_started
    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: kemal
          password: ${DBPASS}
          host: invidious-db
          port: 5432
        check_tables: true
        hmac_key: "${HMAC}"
        # Host-side port differs from the container's 3000; without this
        # Invidious builds self-links on the wrong port.
        external_port: 3001
        domain:
        https_only: false
        invidious_companion:
          - private_url: "http://invidious-companion:8282/companion"
        invidious_companion_key: "${COMPANION}"
        # Everything on — this is a local-only instance on 127.0.0.1.
        filter_related_videos: true
        registration_enabled: true
        login_enabled: true
        statistics_enabled: true
        popular_enabled: true
        # The nav menu is read from user preferences, not top level.
        default_user_preferences:
          default_home: "Discover"
          feed_menu: ["Discover", "Subscriptions", "Playlists"]
          region: "LT"
    healthcheck:
      test: wget -nv --tries=1 --spider http://127.0.0.1:3000/api/v1/stats || exit 1
      interval: 30s
      timeout: 5s
      retries: 2

  invidious-companion:
    image: quay.io/invidious/invidious-companion:latest
    restart: unless-stopped
    environment:
      SERVER_SECRET_KEY: ${COMPANION}
    # Companion talks to YouTube directly; only Invidious talks to companion.
    expose:
      - "8282"

  invidious-db:
    image: docker.io/library/postgres:14
    restart: unless-stopped
    volumes:
      - postgresdata:/var/lib/postgresql/data
      - ./config/sql:/config/sql
      - ./docker/init-invidious-db.sh:/docker-entrypoint-initdb.d/init-invidious-db.sh
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: kemal
      POSTGRES_PASSWORD: ${DBPASS}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgresdata:
